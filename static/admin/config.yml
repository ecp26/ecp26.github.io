# Sveltia CMS configuration for the ECP website.
# The repository name is only an identifier in local mode. Replace it with the
# real GitHub owner/repository before enabling remote editing.
backend:
  name: github
  repo: ecp/local-development
  branch: main

media_folder: static/media
public_folder: /media

collections:
  - name: website
    label: Website
    files:
      - name: homepage
        label: Homepage
        file: content/_index.md
        fields:
          - name: title
            label: Page title
            widget: string

          - name: sections
            label: Page sections
            label_singular: Section
            widget: list
            typeKey: type
            collapsed: true
            types:
              - name: introduction
                label: Introduction and upcoming dates
                fields:
                  - { name: strapline, label: Strapline, widget: string }
                  - { name: summary, label: Summary, widget: text }
                  - { name: period, label: Program period, widget: string }
                  - name: dates
                    label: Upcoming dates
                    label_singular: Date
                    widget: list
                    summary: "{{date}} — {{event}}"
                    fields:
                      - { name: date, label: Date, widget: string }
                      - { name: event, label: Event, widget: string }

              - name: program
                label: Program
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: subheading, label: Subheading, widget: string }
                  - { name: introduction, label: Introduction, widget: text }
                  - { name: lead_in, label: Components introduction, widget: string, required: false }
                  - name: components
                    label: Program components
                    label_singular: Component
                    widget: list
                    summary: "{{heading}}"
                    fields:
                      - { name: heading, label: Heading, widget: string }
                      - { name: text, label: Description, widget: text }
                      - { name: link_label, label: Optional link label, widget: string, required: false }
                      - { name: link_url, label: Optional link URL, widget: string, required: false }

              - name: applications
                label: Applications
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: subheading, label: Subheading, widget: string }
                  - { name: body, label: Application information, widget: markdown }
                  - { name: cost_label, label: Cost label, widget: string, required: false }
                  - { name: cost, label: Cost information, widget: text, required: false }

              - name: certification
                label: Certification
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Certification information, widget: markdown }

              - name: timeline
                label: Timeline
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - name: events
                    label: Events
                    label_singular: Event
                    widget: list
                    summary: "{{date}} — {{event}}"
                    fields:
                      - { name: date, label: Date, widget: string }
                      - { name: event, label: Event, widget: string }

              - name: background
                label: CCP background
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: subheading, label: Subheading, widget: string }
                  - { name: body, label: Background, widget: markdown }
                  - { name: list_heading, label: Coach list heading, widget: string, required: false }
                  - name: coaches
                    label: Certified coaches
                    label_singular: Coach
                    widget: list
                    summary: "{{name}}"
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: achievement, label: Description, widget: text }
                      - { name: profile_url, label: Profile URL, widget: string, required: false }

              - name: organisers
                label: Organisers
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - name: people
                    label: People
                    label_singular: Person
                    widget: list
                    summary: "{{name}} — {{country}}"
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: role, label: Role, widget: string }
                      - { name: country, label: Country, widget: string }

              - name: legal
                label: Imprint and privacy
                fields:
                  - { name: imprint_heading, label: Imprint heading, widget: string }
                  - { name: responsible_label, label: Responsibility label, widget: string, required: false }
                  - { name: responsible, label: Responsible people, widget: text }
                  - { name: contact, label: Contact details, widget: text, required: false }
                  - { name: privacy_heading, label: Privacy heading, widget: string }
                  - { name: privacy, label: Privacy note, widget: markdown }
