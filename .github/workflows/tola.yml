name: Build and deploy Tola site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Tola
        env:
          TOLA_VERSION: 0.7.1
        run: |
          curl --fail --location --silent --show-error \
            --output tola.tar.gz \
            "https://github.com/tola-rs/tola-ssg/releases/download/v${TOLA_VERSION}/tola-x86_64-linux-static.tar.gz"
          curl --fail --location --silent --show-error \
            --output checksums.txt \
            "https://github.com/tola-rs/tola-ssg/releases/download/v${TOLA_VERSION}/checksums.txt"
          grep '  tola-x86_64-linux-static.tar.gz$' checksums.txt \
            | sed 's/tola-x86_64-linux-static.tar.gz/tola.tar.gz/' \
            | sha256sum --check
          tar --extract --gzip --file tola.tar.gz
          sudo install --mode 0755 tola /usr/local/bin/tola
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Validate site
        run: tola validate
      - name: Build site
        run: tola build --clean --site-url "${{ steps.pages.outputs.base_url }}"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
