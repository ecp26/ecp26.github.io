{{ define "main" }}
  <header class="page-header">
    <div class="shell page-header-grid">
      <div><p class="eyebrow">{{ .Params.eyebrow }}</p><h1>{{ .Title }}</h1></div>
      <p class="page-intro">{{ .Params.intro }}</p>
    </div>
  </header>
  <article class="shell article-layout">
    <nav class="page-aside" aria-label="On this page">
      <span>On this page</span>
      <div id="page-toc">{{ .TableOfContents }}</div>
    </nav>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
