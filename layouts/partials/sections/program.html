<section class="content-section" id="program">
  <h2>{{ .heading }}</h2>
  <h3>{{ .subheading }}</h3>
  <p>{{ .introduction }}</p>
  <p>{{ .lead_in }}</p>

  <div class="program-components">
    {{ range .components }}
      <section class="program-component">
        <h4>{{ .heading }}</h4>
        <p>
          {{ .text }}
          {{ if .link_url }}<a href="{{ .link_url }}">{{ .link_label }} ↗</a>{{ end }}
        </p>
      </section>
    {{ end }}
  </div>
</section>
