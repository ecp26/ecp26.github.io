<header class="page-introduction">
  <h1>{{ site.Title }}</h1>
  <p class="strapline">{{ .strapline }}</p>
  <p class="summary">{{ .summary }}</p>
  <p>{{ .period }}</p>
</header>

<aside class="upcoming" aria-labelledby="upcoming-heading">
  <h2 id="upcoming-heading">Upcoming dates</h2>
  <ul>
    {{ range .dates }}
      <li><strong>{{ .date }}</strong><span>{{ .event }}</span></li>
    {{ end }}
  </ul>
</aside>
